services:
  db:
    image: postgres:16-alpine
    container_name: life-care-db
    env_file:
      - ./server/.env
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - life-care-network

  backend:
    image: node:20-alpine
    container_name: life-care-backend
    env_file:
      - ./server/.env
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    build:
      context: ./server
      dockerfile: Dockerfile
    volumes:
      - docker-logs:/var/logs
      - ./server:/app
      - /app/node_modules
    depends_on:
      - db
    networks:
      - life-care-network

  frontend:
    image: node:20-alpine
    container_name: life-care-frontend
    env_file:
      - ./client/.env.local
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    build:
      context: ./client
      dockerfile: Dockerfile
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - life-care-network

networks:
  life-care-network:
    driver: bridge

volumes:
  postgres_data:
  docker-logs:
